services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: commuttify-db
    environment:
      POSTGRES_USER: commuttify
      POSTGRES_PASSWORD: commuttify
      POSTGRES_DB: commuttify
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commuttify -d commuttify"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: commuttify-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
